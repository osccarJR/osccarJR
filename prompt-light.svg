<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="72" viewBox="0 0 1200 72" role="img"><title>Building products, running platforms and refining systems.</title><style>@keyframes blink{0%,48%{opacity:1}50%,100%{opacity:0}}@keyframes flow{to{stroke-dashoffset:-80}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes type{0%{clip-path:inset(0 100% 0 0)}15%,95%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 100% 0 0)}}.typing{animation:type 18s steps(30,end) infinite}.cursor{animation:blink 1.15s steps(1) infinite}.flow{animation:flow 4s linear infinite}.float{animation:float 5s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.typing,.cursor,.flow,.float{animation:none}}</style><rect x="1" y="1" width="1198" height="70" rx="10" fill="#f7f8ff" stroke="#d3d9ed" /><text x="24" y="43" fill="#7853b4" font-size="20" font-weight="400" xml:space="preserve" font-family="DejaVu Sans Mono, Consolas, monospace" >❯ git status</text><text x="240" y="43" fill="#626b8b" font-size="19" font-weight="400" xml:space="preserve" font-family="DejaVu Sans Mono, Consolas, monospace" >building products · running platforms · refining systems</text><rect x="1147" y="25" width="12" height="23" rx="0" fill="#167ca8" stroke="none" class="cursor"/></svg>